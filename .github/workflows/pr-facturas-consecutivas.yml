name: Regression de facturas consecutivas

on:
  push:
    branches: [fix/facturas-consecutivas-envio-20261009]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas-sin-timbrado:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar pytest
        run: python -m pip install pytest pypdf reportlab bandit
      - name: Analisis estatico de alta severidad en el portal
        run: python -m bandit -q -lll arybot/portal_http.py arybot/portal_red.py arybot/portal_modelo.py arybot/constancia_fiscal.py
      - name: Probar facturas consecutivas, altas, RFC y seguridad del portal
        run: python -m pytest -q tests/test_facturas_consecutivas_20261009.py tests/test_compat_vm_20261003.py tests/test_alta_aviso_20261013.py tests/test_constancia_fiscal_20261013.py tests/test_portal_security_20261015.py

  windows-seguridad:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar sintaxis de scripts PowerShell de seguridad
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $failures=@()
          foreach($file in Get-ChildItem -Path . -Filter '*.ps1') {
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count){$failures+=$errors}
          }
          if($failures.Count){$failures|Format-List;throw 'PowerShell parsing failed'}
          Write-Host 'PASS PowerShell security scripts.'
